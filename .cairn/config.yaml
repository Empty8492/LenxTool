version: 3
project:
  name: "LenxTool"
  summary: "面向 Windows 10/11 x64 的 .NET 10 + WPF 本地优先桌面效率应用，覆盖资讯阅读、热点研判、媒体字幕处理及文档与数据轻工具。"
knowledge:
  directory: "cairn"
  language: "zh"
  maintenance: "agents_opt_in"
capture:
  # 这里只控制项目 cairn 当前真相的自动维护；Obsidian 是否自动写入由机器 profile 的 writeMode 决定。
  mode: "automatic_after_substantive_work"
  preflight_retrieval: true
  include_agent_findings: true
  writer: "root_agent"
graduation:
  provider: "obsidian"
  profile: "default"
